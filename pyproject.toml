[project]
name = "secure-service-module-with-tdd"
version = "0.1.0"
description = "A secure, reusable user authentication service module built with TDD."
authors = [
    {name = "iToussaint",email = "iradukundatoussaint01@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=4.2",
]

[tool.poetry]
packages = [{include = "secure_service_module_with_tdd", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["secure_service_module_with_tdd"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
